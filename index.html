<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dziennik Szkoleń LP 2026</title>
    <style>
        :root {
            --lp-green: #1a5c38;
            --lp-light-green: #2d8c55;
            --bg-color: #f4f7f6;
            --text-color: #333;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 20px;
            padding-bottom: 80px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            border-top: 5px solid var(--lp-green);
        }
        h1, h2 {
            color: var(--lp-green);
            text-align: center;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        select, input[type="date"], input[type="text"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
            font-size: 16px;
        }
        .participant-list {
            margin-top: 20px;
        }
        .participant-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            border-bottom: 1px solid #eee;
        }
        .participant-item:nth-child(even) {
            background-color: #fdfdfd;
        }
        .toggle-btn {
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-weight: bold;
            transition: 0.3s;
        }
        .btn-present {
            background-color: var(--lp-light-green);
            color: white;
        }
        .btn-absent {
            background-color: #d9534f;
            color: white;
        }
        .submit-btn {
            display: block;
            width: 100%;
            padding: 15px;
            background-color: var(--lp-green);
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 30px;
            transition: background-color 0.3s;
        }
        .submit-btn:hover {
            background-color: #124026;
        }
        .submit-btn:disabled {
            background-color: #999;
            cursor: not-allowed;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
        }
        .mark-all-btn {
            background-color: #5bc0de;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
        }
    </style>
</head>
<body>

<div class="container">
    <h1>Dziennik Szkolenia Stażystów 2026</h1>
    
    <div class="form-group">
        <label for="grupa">Grupa szkoleniowa:</label>
        <select id="grupa" onchange="zaladujUczestnikow()">
            <option value="">-- Wybierz grupę --</option>
            <option value="I grupa (16-27.11)">I grupa (16-27.11.2026)</option>
            <option value="II grupa (30.11-11.12)">II grupa (30.11-11.12.2026)</option>
        </select>
    </div>

    <div class="form-group">
        <label for="data-szkolenia">Data zajęć:</label>
        <input type="date" id="data-szkolenia">
    </div>

    <div class="form-group">
        <label for="prowadzacy">Prowadzący zajęcia (Imię i Nazwisko):</label>
        <input type="text" id="prowadzacy" placeholder="Wpisz swoje dane">
    </div>

    <div class="form-group">
        <label for="temat">Temat zajęć (skrót):</label>
        <input type="text" id="temat" placeholder="Np. SILP, BO, LMN, Rejestrator...">
    </div>

    <div id="lista-sekcja" style="display: none;">
        <h2>Lista obecności</h2>
        <div class="controls">
            <button class="mark-all-btn" onclick="ustawWszystkich(true)">Zaznacz wszystkich jako OBECNI</button>
            <button class="mark-all-btn" style="background-color: #d9534f;" onclick="ustawWszystkich(false)">Zaznacz wszystkich jako NIEOBECNI</button>
        </div>
        <div class="participant-list" id="lista-uczestnikow">
            <!-- Tutaj pojawią się uczestnicy -->
        </div>
        
        <button id="zapisz-btn" class="submit-btn" onclick="wyslijDane()">Zapisz dzień do Arkusza Google</button>
    </div>
</div>

<script>
    // =========================================================================
    // TUTAJ WKLEJ LINK ZE SKRYPTU GOOGLE (ZACZYNA SIĘ OD HTTPS://SCRIPT.GOOGLE.COM/...)
    // =========================================================================
    const skryptURL = 'TUTAJ_WKLEJ_SKOPIOWANY_ADRES_URL';

    const grupa1 = [
        "Karolina Maćkowiak – Karczma Borowa", "Franciszek Paszkowiak – Karczma Borowa",
        "Maksymilian Bocheński – Kościan", "Izabela Sikorska – Antonin",
        "Norbert Witecki – Łopuchówko", "Damian Malinowski – Łopuchówko",
        "Joanna Zywert – Łopuchówko", "Kacper Krzemieniewski – Łopuchówko",
        "Krzysztof Klebba – Oborniki", "Miłosz Kardacz – Oborniki",
        "Małgorzata Paszke – Pniewy", "Adrianna Kwaśna – Pniewy",
        "Jakub Kit – Kalisz", "Marcin Wróbel – Przedborów",
        "Angelika Netter – Sieraków", "Aleksandra Wylegała – Sieraków",
        "Anna Liczba – Jarocin", "Paweł Kupś – Jarocin",
        "Franciszek Majorek – Grodzisk", "Wojciech Jackowski – Grodzisk",
        "Adam Darmonos – Grodzisk"
    ];

    const grupa2 = [
        "Hubert Staniewski – Jarocin", "Aleksander Adamiak – Jarocin",
        "Amelia Geller – Sieraków", "Marta Szrama – Sieraków",
        "Jakub Siwa – Antonin", "Piotr Sokołowski – Konstantynowo",
        "Karolina Kowalik – Krotoszyn", "Piotr Budych – Pniewy",
        "Jakub Hojan – Pniewy", "Aleksandra Jankiewicz – Turek",
        "Sara Bachorowicz – Grodziec", "Zuzanna Kowalska – Grodziec",
        "Artur Kozłowski – Koło", "Oliwia Babacz – Koło",
        "Kacper Kozłowski – Konin", "Martyna Łuszczyńska – Góra Śląska",
        "Julia Ratajczak – Babki", "Julia Słomińska – Babki",
        "Martyna Barcz – Babki", "Jakub Zachciał – Oborniki",
        "Dominika Bogacz – Oborniki"
    ];

    let aktualnaLista = [];
    let statusObecnosci = {}; // true = obecny, false = nieobecny

    // Ustaw dzisiejszą datę jako domyślną
    document.getElementById('data-szkolenia').valueAsDate = new Date();

    function zaladujUczestnikow() {
        const wybranaGrupa = document.getElementById('grupa').value;
        const sekcjaListy = document.getElementById('lista-sekcja');
        const kontenerListy = document.getElementById('lista-uczestnikow');
        
        if (!wybranaGrupa) {
            sekcjaListy.style.display = 'none';
            return;
        }

        aktualnaLista = wybranaGrupa.includes('I grupa') ? grupa1 : grupa2;
        statusObecnosci = {};
        
        kontenerListy.innerHTML = '';
        aktualnaLista.forEach((osoba, index) => {
            statusObecnosci[index] = true; // Domyślnie wszyscy obecni
            
            const div = document.createElement('div');
            div.className = 'participant-item';
            div.innerHTML = `
                <span>${index + 1}. ${osoba}</span>
                <button id="btn-${index}" class="toggle-btn btn-present" onclick="zmienStatus(${index})">OBECNY</button>
            `;
            kontenerListy.appendChild(div);
        });

        sekcjaListy.style.display = 'block';
    }

    function zmienStatus(index) {
        statusObecnosci[index] = !statusObecnosci[index];
        aktualizujPrzycisk(index);
    }

    function ustawWszystkich(stan) {
        aktualnaLista.forEach((_, index) => {
            statusObecnosci[index] = stan;
            aktualizujPrzycisk(index);
        });
    }

    function aktualizujPrzycisk(index) {
        const btn = document.getElementById(`btn-${index}`);
        if (statusObecnosci[index]) {
            btn.className = 'toggle-btn btn-present';
            btn.innerText = 'OBECNY';
        } else {
            btn.className = 'toggle-btn btn-absent';
            btn.innerText = 'NIEOBECNY';
        }
    }

    function wyslijDane() {
        const dataSzkolenia = document.getElementById('data-szkolenia').value;
        const grupa = document.getElementById('grupa').value;
        const prowadzacy = document.getElementById('prowadzacy').value.trim();
        const temat = document.getElementById('temat').value.trim();

        if (!dataSzkolenia || !prowadzacy || !temat) {
            alert("Proszę wypełnić datę, prowadzącego i temat zajęć.");
            return;
        }

        if (skryptURL === 'TUTAJ_WKLEJ_SKOPIOWANY_ADRES_URL') {
            alert("BŁĄD: Skonfiguruj poprawny link do Apps Script w kodzie HTML!");
            return;
        }

        const obecni = [];
        const nieobecni = [];

        aktualnaLista.forEach((osoba, index) => {
            if (statusObecnosci[index]) {
                obecni.push(osoba);
            } else {
                nieobecni.push(osoba);
            }
        });

        const btn = document.getElementById('zapisz-btn');
        btn.innerText = "Wysyłanie danych...";
        btn.disabled = true;

        const daneDoWyslania = {
            dataSzkolenia: dataSzkolenia,
            grupa: grupa,
            prowadzacy: prowadzacy,
            temat: temat,
            obecni: obecni.join(' | '),
            nieobecni: nieobecni.join(' | ')
        };

        fetch(skryptURL, {
            method: 'POST',
            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
            body: JSON.stringify(daneDoWyslania)
        })
        .then(response => response.json())
        .then(data => {
            alert('Sukces! Obecność zapisana w Arkuszu Google.');
            btn.innerText = "Zapisz dzień do Arkusza Google";
            btn.disabled = false;
        })
        .catch(error => {
            alert('Wystąpił błąd podczas wysyłania. Sprawdź połączenie z internetem.');
            console.error(error);
            btn.innerText = "Zapisz dzień do Arkusza Google";
            btn.disabled = false;
        });
    }
</script>

</body>
</html>
